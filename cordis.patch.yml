# @martin/dsh-voice — self-contained two-way voice for the DSH web app.
#
# One bundle for the whole voice round-trip:
#   in : the unified voice composer (this plugin's ui-voice slot)
#   out: per-message speaker buttons + auto-read (this plugin's tts service)
# The speech-to-text stack is inserted here as well, so the web profile no
# longer needs the retired dsh-voice-chat kit.
- id: ui-voice-input
  name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'
  disabled: true
- insert:
  - id: ui-voice
    name: '@martin/dsh-voice'
  - id: speech-to-text
    name: '@deepseek-ai/dsh-experimental-speech-to-text'
    config:
      defaultProvider: sensevoice-local
      language: en
  - id: speech-to-text-sensevoice
    name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
    config:
      dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
  - id: api-speech-to-text
    name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
